<body data-fx="none" data-route="roulette">
<div class="fxwrap" aria-hidden="true"><canvas id="gl"></canvas></div>
<div class="backdrop" id="backdrop" aria-hidden="true"></div>

<header class="top">
  <a class="mark" href="" data-nav aria-label="Кинорулетка, на главную">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="6.6" r="2" fill="currentColor"/><circle cx="12" cy="17.4" r="2" fill="currentColor"/><circle cx="6.6" cy="12" r="2" fill="currentColor"/><circle cx="17.4" cy="12" r="2" fill="currentColor"/></svg>
    <span>Кинорулетка</span>
  </a>
  <nav class="nav" aria-label="Разделы">
    <a href="" data-nav data-sec-link="roulette">Рулетка</a><a href="catalog" data-nav data-sec-link="catalog">Каталог</a><i class="ndot" id="navDot" aria-hidden="true"></i>
  </nav>
  <div class="tools">
    <button class="tool" id="searchBtn" type="button" aria-label="Поиск" title="Поиск (/)"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
    <a class="tool" id="listBtn" href="me/favorites" data-nav data-sec-link="me" aria-label="Мои списки" title="Мои списки"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-9.2-9.3C1.7 7.6 3.6 4.5 7 4.5c2 0 3.7 1.2 5 3 1.3-1.8 3-3 5-3 3.4 0 5.3 3.1 4.2 6.2C19.5 15.4 12 20 12 20z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="lbadge" id="listBadge" hidden></span></a>
    <div id="avatar"></div>
    <button class="tool ib" id="fxBtn" type="button" role="switch" aria-checked="true" aria-label="Эффекты" title="Эффекты: вкл"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3l1.9 5.6 5.6 1.9-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z"/><path d="M19 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg></button>
  </div>
</header>

<main class="main">
  <section class="stage" id="stage" aria-label="Барабан">
    <div class="reel" id="reel" aria-hidden="true">
      <div class="strip" id="strip"></div>
      <div class="vig" id="vig"></div>
      <div class="gate" id="gate"><i></i><i></i><i></i><i></i></div>
    </div>
    <article class="result" id="result" hidden tabindex="-1" aria-live="polite"></article>
  </section>
</main>

<div class="fxtop" id="fxTop" aria-hidden="true"></div>
<div class="toast" id="toast" hidden><p class="status" id="status" role="status" aria-live="polite"></p><button class="tbtn" id="toastBtn" type="button" hidden></button></div>

<div class="pult" id="pult" role="group" aria-label="Что крутим">
  <button class="pf" id="fType" type="button" data-sec="type" aria-haspopup="dialog" aria-controls="picker"><small>Что</small><span></span></button><i class="sep" aria-hidden="true"></i>
  <button class="pf w" id="fGenre" type="button" data-sec="genre" aria-haspopup="dialog" aria-controls="picker"><small>Жанр</small><span></span></button><i class="sep" aria-hidden="true"></i>
  <button class="pf" id="fYears" type="button" data-sec="years" aria-haspopup="dialog" aria-controls="picker"><small>Годы</small><span></span></button><i class="sep" aria-hidden="true"></i>
  <button class="pf" id="fRate" type="button" data-sec="rate" aria-haspopup="dialog" aria-controls="picker"><small>Рейтинг</small><span></span></button>
  <button class="pf sum" id="fSum" type="button" data-sec="all" aria-haspopup="dialog" aria-controls="picker"><span></span><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  <button class="spin" id="spin" type="button"><span>Крутить</span></button>
</div>

<dialog class="panel picker" id="picker" aria-label="Настройки">
  <div class="panel-in">
    <section class="sec" data-sec="type">
      <h2 class="slabel" id="ptTitle">Что</h2>
      <div class="opts" id="types" role="radiogroup" aria-labelledby="ptTitle">
        <button type="button" role="radio" data-mode="all">Фильмы и сериалы</button>
        <button type="button" role="radio" data-mode="movie">Фильмы</button>
        <button type="button" role="radio" data-mode="series">Сериалы</button>
        <button type="button" role="radio" data-mode="anime">Аниме</button>
      </div>
    </section>
    <section class="sec" data-sec="genre">
      <div class="shead"><h2 class="slabel" id="pgTitle">Жанры</h2><span class="cnt" id="gCount" aria-live="polite"></span></div>
      <div class="glist" id="genres" role="group" aria-labelledby="pgTitle"></div>
      <p class="hint" id="hint" aria-live="polite"></p>
    </section>
    <section class="sec" data-sec="years">
      <h2 class="slabel" id="dLbl">Годы</h2>
      <div class="dec" id="decades" role="group" aria-labelledby="dLbl"></div>
      <div id="yearRange"></div>
    </section>
    <section class="sec" data-sec="rate">
      <h2 class="slabel" id="kLbl">Рейтинг</h2>
      <div class="opts" id="known" role="radiogroup" aria-labelledby="kLbl">
        <button type="button" role="radio" data-known="0">Всё подряд</button>
        <button type="button" role="radio" data-known="1">Только известные</button>
      </div>
      <label class="rlbl" for="rating">Оценка IMDb от</label>
      <div class="range"><input id="rating" type="range" min="0" max="9" step="0.5" value="0"><output id="ratingOut" for="rating"></output></div>
      <button class="switch" id="noRepeat" type="button" role="switch" aria-checked="true"><span class="knob" aria-hidden="true"></span>Не повторять уже выпавшее</button>
        <button class="switch" id="noWatched" type="button" role="switch" aria-checked="false"><span class="knob" aria-hidden="true"></span>Не показывать просмотренное</button>
    </section>
    <section class="sec" data-sec="sound">
      <h2 class="slabel" id="sndLbl">Звук</h2>
      <label class="rlbl" for="chatVol">Сообщения в чате</label>
      <div class="range"><input id="chatVol" type="range" min="0" max="100" step="5" value="40" aria-describedby="sndLbl"><output id="chatVolOut" for="chatVol"></output></div>
    </section>
    <section class="sec" data-sec="beta">
      <h2 class="slabel" id="betaLbl">Бета</h2>
      <button class="switch swb" id="beta" type="button" role="switch" aria-checked="false" aria-describedby="betaHint"><span class="knob" aria-hidden="true"></span><span class="swt">Бета-оформление<small id="betaHint">Плавные анимации и обновлённые карточки</small></span></button>
    </section>
    <div class="pfoot"><button class="ghost" id="pReset" type="button">Сбросить</button><button class="ok" id="pDone" type="button">Готово</button></div>
  </div>
</dialog>

<section class="view" id="view" hidden></section>

<nav class="tabbar" aria-label="Разделы">
  <a href="" data-nav data-sec-link="roulette"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="7.5" r="1.6" fill="currentColor"/><circle cx="12" cy="16.5" r="1.6" fill="currentColor"/><circle cx="7.5" cy="12" r="1.6" fill="currentColor"/><circle cx="16.5" cy="12" r="1.6" fill="currentColor"/></svg>Рулетка</a>
  <a href="catalog" data-nav data-sec-link="catalog"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>Каталог</a>
  <a href="me/favorites" data-nav data-sec-link="me"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-9.2-9.3C1.7 7.6 3.6 4.5 7 4.5c2 0 3.7 1.2 5 3 1.3-1.8 3-3 5-3 3.4 0 5.3 3.1 4.2 6.2C19.5 15.4 12 20 12 20z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>Списки</a>
</nav>

<dialog class="adlg" id="auth" aria-label="Вход"></dialog>
<dialog class="cpop" id="cpop" aria-label="Фильтры"></dialog>
<dialog class="adlg" id="shareDlg" aria-label="Поделиться"></dialog>

<dialog class="tmodal" id="tmodal" aria-labelledby="tmTitle">
  <div class="tm-box">
    <div class="tm-head">
      <h3 id="tmTitle"></h3>
      <div class="tm-tools">
        <div class="tm-lang" role="group" aria-label="Язык трейлера"><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button></div>
        <a class="tm-yt" id="tmYt" target="_blank" rel="noopener">YouTube ↗</a>
        <button class="tm-x" type="button" data-close aria-label="Закрыть">✕</button>
      </div>
    </div>
    <div class="tm-frame" id="tmFrame"></div>
  </div>
</dialog>

<dialog class="tmodal" id="lmodal" aria-labelledby="lmTitle">
  <div class="tm-box" id="lmBox">
    <div class="lm-main">
      <div class="tm-head">
        <div class="lm-head-txt"><h3 id="lmTitle"></h3><p class="lm-prog" id="lmProg" hidden></p></div>
        <div class="tm-tools">
          <button class="tm-x" type="button" data-lclose aria-label="Закрыть">✕</button>
        </div>
      </div>
      <div class="tm-frame" id="lmFrame"></div>
    </div>
    <aside class="wp-side" id="wpPanel" hidden aria-label="Комната просмотра">
      <header class="wp-head">
        <div class="wp-id"><small>Комната</small><span class="wp-code" id="wpCode">····</span></div>
        <button type="button" class="btn line wp-invite" id="wpCopy">Пригласить</button>
      </header>
      <div class="wp-people" id="wpMembers" aria-live="polite"></div>
      <label class="wp-nick">Твоё имя<input id="wpNick" type="text" maxlength="24" autocomplete="nickname" placeholder="Гость"></label>
      <section class="wp-sync" id="wpSync" hidden></section>
      <section class="wp-chat" id="wpChat" aria-label="Чат">
        <div class="wp-msgs" id="wpMsgs"></div>
        <form class="wp-form" id="wpForm" autocomplete="off"><input id="wpInput" type="text" maxlength="400" placeholder="Написать в чат…"><button type="submit" class="wp-send" aria-label="Отправить">↵</button></form>
      </section>
    </aside>
  </div>
</dialog>
