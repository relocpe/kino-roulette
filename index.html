<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кинорулетка — случайный фильм или сериал</title>
<meta name="description" content="Выбери жанр — фильмы, сериалы и аниме, крути барабан и получи фильм или сериал на вечер. Трейлер и ссылки на легальные сервисы.">
<meta name="theme-color" content="#0c0b0a">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="Кинорулетка">
<meta property="og:description" content="Случайный фильм или сериал по жанру и настроению.">
<meta property="og:image" content="https://relocpe.github.io/kino-roulette/og.jpg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/golos-text-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>

<link rel="preconnect" href="https://api.tiffara.com" crossorigin>
<link rel="preconnect" href="https://m.media-amazon.com">
<link rel="stylesheet" href="css/app.css?v=8">
</head>
<body data-fx="idle">
<div class="fxwrap" aria-hidden="true">
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>
  <div class="overlay"></div>
  <canvas id="fxTop"></canvas>
</div>
<div class="backdrop" id="backdrop" aria-hidden="true"></div>

<header class="top">
  <a class="mark" href="./" aria-label="Кинорулетка, на главную">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="6.6" r="2" fill="currentColor"/><circle cx="12" cy="17.4" r="2" fill="currentColor"/><circle cx="6.6" cy="12" r="2" fill="currentColor"/><circle cx="17.4" cy="12" r="2" fill="currentColor"/></svg>
    <span>Кинорулетка</span>
  </a>
  <nav class="tools">
    <button class="tool ib" id="fxBtn" type="button" role="switch" aria-checked="true" aria-label="Эффекты" title="Эффекты: вкл"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3l1.9 5.6 5.6 1.9-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z"/><path d="M19 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg></button>
    <button class="tool hist" id="histBtn" type="button" aria-haspopup="dialog" aria-controls="histPanel" aria-label="История" title="История"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><circle cx="10" cy="10" r="7.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 6v4.3l2.8 1.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="histCount" class="hdot" hidden></span></button>
  </nav>
</header>

<main class="main">
  <section class="stage" id="stage" aria-label="Барабан">
    <div class="reel" id="reel" aria-hidden="true">
      <div class="strip" id="strip"></div>
      <div class="gate" id="gate"><i></i><i></i><i></i><i></i></div>
    </div>
    <article class="result" id="result" hidden tabindex="-1" aria-live="polite"></article>
  </section>
</main>

<div class="toast" id="toast" hidden><p class="status" id="status" role="status" aria-live="polite"></p><button class="tbtn" id="toastBtn" type="button" hidden></button></div>

<div class="pult" id="pult" role="group" aria-label="Что крутим">
  <button class="pf" id="fType" type="button" data-sec="type" aria-haspopup="dialog" aria-controls="picker"><small>Что</small><span></span></button><i class="sep" aria-hidden="true"></i>
  <button class="pf w" id="fGenre" type="button" data-sec="genre" aria-haspopup="dialog" aria-controls="picker"><small>Жанр</small><span></span></button><i class="sep" aria-hidden="true"></i>
  <button class="pf" id="fYears" type="button" data-sec="years" aria-haspopup="dialog" aria-controls="picker"><small>Годы</small><span></span></button><i class="sep" aria-hidden="true"></i>
  <button class="pf" id="fRate" type="button" data-sec="rate" aria-haspopup="dialog" aria-controls="picker"><small>Рейтинг</small><span></span></button>
  <button class="pf sum" id="fSum" type="button" data-sec="all" aria-haspopup="dialog" aria-controls="picker"><span></span><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  <button class="spin" id="spin" type="button"><span>Крутить</span></button>
</div>

<dialog class="panel picker" id="picker" aria-label="Настройки">
  <div class="panel-in">
    <section class="sec" data-sec="type">
      <h2 class="slabel" id="ptTitle">Что</h2>
      <div class="opts" id="types" role="radiogroup" aria-labelledby="ptTitle">
        <button type="button" role="radio" data-mode="all">Фильмы и сериалы</button>
        <button type="button" role="radio" data-mode="movie">Фильмы</button>
        <button type="button" role="radio" data-mode="series">Сериалы</button>
      </div>
    </section>
    <section class="sec" data-sec="genre">
      <div class="shead"><h2 class="slabel" id="pgTitle">Жанры</h2><span class="cnt" id="gCount" aria-live="polite"></span></div>
      <div class="glist" id="genres" role="group" aria-labelledby="pgTitle"></div>
      <p class="hint" id="hint" aria-live="polite"></p>
    </section>
    <section class="sec" data-sec="years">
      <h2 class="slabel" id="dLbl">Годы</h2>
      <div class="dec" id="decades" role="group" aria-labelledby="dLbl"></div>
    </section>
    <section class="sec" data-sec="rate">
      <h2 class="slabel" id="kLbl">Рейтинг</h2>
      <div class="opts" id="known" role="radiogroup" aria-labelledby="kLbl">
        <button type="button" role="radio" data-known="0">Всё подряд</button>
        <button type="button" role="radio" data-known="1">Только известные</button>
      </div>
      <label class="rlbl" for="rating">Оценка IMDb от</label>
      <div class="range"><input id="rating" type="range" min="0" max="9" step="0.5" value="0"><output id="ratingOut" for="rating"></output></div>
      <button class="switch" id="noRepeat" type="button" role="switch" aria-checked="true"><span class="knob" aria-hidden="true"></span>Не показывать то, что уже выпадало</button>
    </section>
    <div class="pfoot"><button class="ghost" id="pReset" type="button">Сбросить</button><button class="ok" id="pDone" type="button">Готово</button></div>
  </div>
</dialog>

<dialog class="drawer" id="histPanel" aria-labelledby="hTitle">
  <div class="drawer-in">
    <div class="phead"><h2 id="hTitle">История</h2><button class="px" type="button" data-close aria-label="Закрыть">✕</button></div>
    <div class="hlist" id="hlist"></div>
    <button class="btn ghost" id="histClear" type="button">Очистить историю</button>
    <p class="credits">Данные: IMDb через открытый API, AniList и Википедия. Смотреть — на легальных сервисах.</p>
  </div>
</dialog>

<dialog class="tmodal" id="tmodal" aria-labelledby="tmTitle">
  <div class="tm-box">
    <div class="tm-head">
      <h3 id="tmTitle"></h3>
      <div class="tm-tools">
        <div class="tm-lang" role="group" aria-label="Язык трейлера"><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button></div>
        <a class="tm-yt" id="tmYt" target="_blank" rel="noopener">YouTube ↗</a>
        <button class="tm-x" type="button" data-close aria-label="Закрыть">✕</button>
      </div>
    </div>
    <div class="tm-frame" id="tmFrame"></div>
  </div>
</dialog>


<script type="module" src="js/app.js?v=8"></script>
</body>
</html>
