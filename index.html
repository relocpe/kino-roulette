<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кинорулетка — случайный фильм или сериал</title>
<meta name="description" content="Выбери жанры и настроение, крути барабан и получи фильм или сериал на вечер. Трейлер и ссылки на легальные сервисы.">
<meta name="theme-color" content="#0c0b0a">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="Кинорулетка">
<meta property="og:description" content="Случайный фильм или сериал по жанру и настроению.">
<meta property="og:image" content="https://relocpe.github.io/kino-roulette/og.jpg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/golos-text-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>

<link rel="preconnect" href="https://api.tiffara.com" crossorigin>
<link rel="preconnect" href="https://m.media-amazon.com">
<link rel="stylesheet" href="css/app.css?v=5">
</head>
<body data-fx="idle">
<div class="fxwrap" aria-hidden="true">
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>
  <div class="overlay"></div>
  <canvas id="fxTop"></canvas>
</div>
<div class="backdrop" id="backdrop" aria-hidden="true"></div>

<header class="top">
  <a class="mark" href="./" aria-label="Кинорулетка, на главную">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="6.6" r="2" fill="currentColor"/><circle cx="12" cy="17.4" r="2" fill="currentColor"/><circle cx="6.6" cy="12" r="2" fill="currentColor"/><circle cx="17.4" cy="12" r="2" fill="currentColor"/></svg>
    <span>Кинорулетка</span>
  </a>
  <nav class="tools">
    <button class="tool" id="fxBtn" type="button" aria-pressed="true">Эффекты</button>
    <button class="tool sound" id="soundBtn" type="button" aria-pressed="false" title="Звук в тёмных жанрах"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M2 6h3l4-3v10L5 10H2z" fill="currentColor"/><path class="w" d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.5a6 6 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span>Звук</span></button>
    <button class="tool" id="histBtn" type="button" aria-haspopup="dialog" aria-controls="histPanel">История<span id="histCount" class="count"></span></button>
  </nav>
</header>

<main class="main">
  <section class="stage" id="stage" aria-label="Барабан">
    <div class="reel" id="reel" aria-hidden="true">
      <div class="strip" id="strip"></div>
      <div class="gate" id="gate"><i></i><i></i><i></i><i></i></div>
    </div>
    <article class="result" id="result" hidden tabindex="-1" aria-live="polite"></article>
  </section>

  <div class="bar" id="bar">
    <p class="query" id="query"><span id="qtext"></span> <button class="qedit" id="editBtn" type="button" aria-haspopup="dialog" aria-controls="filters">Изменить</button></p>
    <button class="spin" id="spin" type="button"><span>Крутить</span></button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>
</main>

<dialog class="panel" id="filters" aria-labelledby="fTitle">
  <div class="panel-in">
    <div class="phead"><h2 id="fTitle">Что крутим</h2><button class="px" type="button" data-close aria-label="Закрыть">✕</button></div>

    <div class="seg" role="radiogroup" aria-label="Что ищем">
      <button type="button" role="radio" data-mode="movie">Фильмы</button>
      <button type="button" role="radio" data-mode="series">Сериалы</button>
      <button type="button" role="radio" data-mode="all">Всё</button>
    </div>

    <section class="fsec">
      <h3 class="flabel" id="gLbl">Жанры <span class="cnt" id="gCount"></span></h3>
      <div class="chips" id="genres" role="group" aria-labelledby="gLbl"></div>
      <button class="more" id="moreG" type="button" aria-expanded="false">Все жанры</button>
      <div class="subs" id="subs"></div>
      <p class="hint" id="hint" aria-live="polite"></p>
    </section>

    <section class="fsec">
      <h3 class="flabel" id="dLbl">Годы</h3>
      <div class="chips dec" id="decades" role="group" aria-labelledby="dLbl"></div>
    </section>

    <section class="fsec">
      <h3 class="flabel"><label for="rating">Рейтинг IMDb от</label></h3>
      <div class="range"><input id="rating" type="range" min="0" max="9" step="0.5" value="6.5"><output id="ratingOut" for="rating">6.5</output></div>
    </section>

    <button class="switch" id="noRepeat" type="button" role="switch" aria-checked="true"><span class="knob" aria-hidden="true"></span>Не показывать то, что уже выпадало</button>

    <div class="pfoot"><button class="btn ghost" id="resetBtn" type="button">Сбросить</button><button class="btn primary" type="button" data-close>Готово</button></div>
  </div>
</dialog>

<dialog class="drawer" id="histPanel" aria-labelledby="hTitle">
  <div class="drawer-in">
    <div class="phead"><h2 id="hTitle">История</h2><button class="px" type="button" data-close aria-label="Закрыть">✕</button></div>
    <div class="hlist" id="hlist"></div>
    <button class="btn ghost" id="histClear" type="button">Очистить историю</button>
  </div>
</dialog>

<dialog class="tmodal" id="tmodal" aria-labelledby="tmTitle">
  <div class="tm-box">
    <div class="tm-head">
      <h3 id="tmTitle"></h3>
      <div class="tm-tools">
        <div class="tm-lang" role="group" aria-label="Язык трейлера"><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button></div>
        <a class="tm-yt" id="tmYt" target="_blank" rel="noopener">YouTube ↗</a>
        <button class="tm-x" type="button" data-close aria-label="Закрыть">✕</button>
      </div>
    </div>
    <div class="tm-frame" id="tmFrame"></div>
  </div>
</dialog>

<footer class="foot">
  <p>Данные: IMDb через открытый API и Википедия. Смотреть — на легальных сервисах.</p>
</footer>

<script type="module" src="js/app.js?v=5"></script>
</body>
</html>
