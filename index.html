<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кинорулетка — случайный фильм или сериал</title>
<meta name="description" content="Выбери жанры и настроение, крути барабан и получи фильм или сериал на вечер. Трейлер и ссылки на легальные сервисы.">
<meta name="theme-color" content="#0c0b0a">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="Кинорулетка">
<meta property="og:description" content="Случайный фильм или сериал по жанру и настроению.">
<meta property="og:image" content="https://relocpe.github.io/kino-roulette/og.jpg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/golos-text-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant-cyrillic-600-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://api.tiffara.com" crossorigin>
<link rel="preconnect" href="https://m.media-amazon.com">
<link rel="stylesheet" href="css/app.css?v=3">
</head>
<body data-fx="idle">
<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="overlay" aria-hidden="true"></div>
<canvas id="fxTop" aria-hidden="true"></canvas>

<header class="top">
  <a class="mark" href="./" aria-label="Кинорулетка, на главную">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="6.6" r="2" fill="currentColor"/><circle cx="12" cy="17.4" r="2" fill="currentColor"/><circle cx="6.6" cy="12" r="2" fill="currentColor"/><circle cx="17.4" cy="12" r="2" fill="currentColor"/></svg>
    <span>Кинорулетка</span>
  </a>
  <nav class="tools">
    <button class="link sound" id="soundBtn" type="button" aria-pressed="true" title="Звук в тёмных жанрах"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M2 6h3l4-3v10L5 10H2z" fill="currentColor"/><path class="w" d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.5a6 6 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span>Звук вкл</span></button>
    <button class="link" id="histBtn" type="button" aria-controls="history">История <span id="histCount" class="count"></span></button>
  </nav>
</header>

<main class="layout">
  <aside class="controls" aria-label="Фильтры">
    <h1>Что смотрим<br><em>сегодня?</em></h1>
    <p class="lede">Отметь жанры или настроение и крути барабан. Если отметишь несколько, выпадет любой из них.</p>

    <div class="seg" role="radiogroup" aria-label="Что ищем">
      <button type="button" role="radio" data-mode="movie">Фильмы</button>
      <button type="button" role="radio" data-mode="series">Сериалы</button>
      <button type="button" role="radio" data-mode="all">Всё</button>
    </div>

    <fieldset class="group">
      <legend>Жанры</legend>
      <div class="chips" id="genres"></div>
    </fieldset>
    <fieldset class="group">
      <legend>Поджанры и настроение</legend>
      <div class="chips" id="moods"></div>
    </fieldset>

    <div class="filters">
      <div class="field">
        <span class="label" id="yearsLbl">Годы</span>
        <div class="years" role="group" aria-labelledby="yearsLbl">
          <input id="yFrom" type="number" inputmode="numeric" min="1900" max="2030" placeholder="1900" aria-label="С какого года">
          <span aria-hidden="true">–</span>
          <input id="yTo" type="number" inputmode="numeric" min="1900" max="2030" placeholder="сейчас" aria-label="По какой год">
        </div>
      </div>
      <div class="field">
        <label class="label" for="rating">Рейтинг IMDb от <output id="ratingOut" for="rating">6.5</output></label>
        <input id="rating" type="range" min="0" max="9" step="0.5" value="6.5">
      </div>
    </div>
    <label class="check"><input type="checkbox" id="noRepeat" checked> <span>Не показывать то, что уже выпадало</span></label>
    <div class="selnote" id="selnote" aria-live="polite"></div>
    <button class="clear link" type="button" id="clearSel" hidden>Сбросить выбор</button>
  </aside>

  <section class="stage" aria-label="Барабан">
    <div class="reel" id="reel" aria-hidden="true">
      <div class="strip" id="strip"></div>
      <div class="gate"><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="spinrow">
      <button class="spin" id="spin" type="button"><span>Крутить</span></button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>

    <article class="result" id="result" hidden tabindex="-1" aria-live="polite"></article>

    <section class="history" id="history" aria-label="Недавно выпадало" hidden>
      <div class="hhead"><h2>Недавно выпадало</h2><button class="link" id="histClear" type="button">Очистить</button></div>
      <div class="hrow" id="hrow"></div>
    </section>
  </section>
</main>

<footer class="foot">
  <p>Данные о фильмах: IMDb через открытый API (api.tiffara.com) и Википедия. Смотреть — только на легальных сервисах.</p>
</footer>

<script type="module" src="js/app.js?v=3"></script>
</body>
</html>
